[package]
name = "cipherboard-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stroke smoothing, event encode/decode, snapshot/replay (no secrets)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", default-features = false, features = [
    "Crypto",
    "CryptoKey",
    "SubtleCrypto",
    "AesGcmParams",
    "Window",
    "WorkerGlobalScope",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
thiserror = "2"

[dev-dependencies]
proptest = "1"
wasm-bindgen-test = "0.3"

[features]
default = []
