[package]
name = "cipherboard-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cipherboard Axum relay server — ciphertext only"

[lib]
name = "cipherboard_server"
path = "src/lib.rs"

[[bin]]
name = "cipherboard-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "trace", "limit", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
futures-util = "0.3"
dashmap = "6"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
parking_lot = "0.12"
mime_guess = "2"
http = "1"
bytes = "1"
http-body = "1"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
